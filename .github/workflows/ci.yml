name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build, e2e
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real-but-needs-to-exist
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  postgres:
    # The scale-out setup (docs/SCALING.md): PostgreSQL instead of SQLite,
    # Redis for events, presence, rate limits and job locks, and attachments in
    # S3 (MinIO), with the e2e suite run against two app instances sharing all three.
    name: PostgreSQL and Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kanbun
          POSTGRES_PASSWORD: kanbun
          POSTGRES_DB: kanbun
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kanbun" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kanbun:kanbun@localhost:5432/kanbun
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real-but-needs-to-exist
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Postgres schema is generated from prisma/schema.prisma
        run: npm run db:pg:check
      - run: npm run build
      - name: Migrate PostgreSQL
        run: node scripts/db.mjs deploy
      - name: Postgres migrations match the schema
        run: node scripts/gen-postgres-schema.mjs --check-db
      - name: Unit tests (with Redis)
        run: npm test
        env:
          TEST_REDIS_URL: redis://localhost:6379
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Service containers can not be given a command, so MinIO starts here.
      - name: Start MinIO and create the attachments bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=kanbun-ci -e MINIO_ROOT_PASSWORD=kanbun-ci-secret \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live
          docker run --rm --network host \
            -e MC_HOST_ci=http://kanbun-ci:kanbun-ci-secret@localhost:9000 \
            minio/mc mb ci/kanbun-e2e
      - name: End-to-end tests on PostgreSQL, two instances sharing Redis and S3
        run: npm run test:e2e
        env:
          E2E_POSTGRES_URL: postgresql://kanbun:kanbun@localhost:5432/kanbun_e2e
          REDIS_URL: redis://localhost:6379
          E2E_SCALE_OUT: "1"
          ATTACHMENTS_S3_BUCKET: kanbun-e2e
          ATTACHMENTS_S3_ENDPOINT: http://localhost:9000
          ATTACHMENTS_S3_ACCESS_KEY_ID: kanbun-ci
          ATTACHMENTS_S3_SECRET_ACCESS_KEY: kanbun-ci-secret
      - name: MinIO log
        if: failure()
        run: docker logs minio || true
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-postgres
          path: test-results/
          retention-days: 7
