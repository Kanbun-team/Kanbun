name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    name: Skip if no new commits
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      sha: ${{ steps.check.outputs.sha }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      date: ${{ steps.check.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y%m%d)
          git fetch origin --tags --force
          LAST=$(git rev-parse refs/tags/nightly 2>/dev/null || echo "")
          if [ -n "$LAST" ] && [ "$LAST" = "$SHA" ]; then
            echo "No new commits since last nightly ($LAST). Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

  docker:
    name: Build + push nightly image
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-${{ needs.check.outputs.date }}
            type=raw,value=sha-${{ needs.check.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Kanbun (nightly)
            org.opencontainers.image.description=Self-hosted task boards, bleeding edge from main
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            KANBUN_BUILD_SHA=${{ needs.check.outputs.sha }}
            KANBUN_BUILD_DATE=${{ needs.check.outputs.date }}
            KANBUN_REPO_URL=https://github.com/${{ github.repository }}

  release:
    name: Update rolling nightly release
    needs: [check, docker]
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move rolling tag
        run: |
          git tag -f nightly ${{ needs.check.outputs.sha }}
          git push -f origin refs/tags/nightly
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly (${{ needs.check.outputs.date }} - ${{ needs.check.outputs.short_sha }})"
          prerelease: true
          target_commitish: ${{ needs.check.outputs.sha }}
          generate_release_notes: false
          body: |
            Bleeding-edge build from `main` at commit [`${{ needs.check.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ needs.check.outputs.sha }}).

            ## Pull

            ```
            docker pull ghcr.io/${{ github.repository }}:nightly
            ```

            Pinned variants for this build:

            ```
            ghcr.io/${{ github.repository }}:nightly-${{ needs.check.outputs.date }}
            ghcr.io/${{ github.repository }}:sha-${{ needs.check.outputs.short_sha }}
            ```

            Multi-arch: `linux/amd64`, `linux/arm64`. Image digest: `${{ needs.docker.outputs.digest }}`.

            ## Caveats

            - Not recommended for production.
            - Schema may change between nightlies. Back up `kanbun.db` before pulling a newer nightly.
            - This release is replaced every night the `main` branch has new commits. The `nightly` tag is rewritten in-place; `nightly-YYYYMMDD` and `sha-*` are immutable.
