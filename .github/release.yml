changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
    authors:
      - dependabot
      - renovate-bot
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
        - breaking
    - title: New features
      labels:
        - feat
        - feature
        - enhancement
    - title: Bug fixes
      labels:
        - fix
        - bug
    - title: Performance
      labels:
        - perf
        - performance
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Refactoring + internals
      labels:
        - refactor
        - chore
        - ci
        - test
    - title: Other
      labels:
        - "*"
